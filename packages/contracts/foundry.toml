[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10000
via_ir = false
bytecode_hash = "ipfs"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
qie = "https://rpc1mainnet.qie.digital"
qie_testnet = "https://rpc1testnet.qie.digital"

[etherscan]
qie = { key = "blockscout", url = "https://mainnet.qie.digital/api", chain = 1990 }
qie_testnet = { key = "blockscout", url = "https://testnet.qie.digital/api", chain = 1983 }
